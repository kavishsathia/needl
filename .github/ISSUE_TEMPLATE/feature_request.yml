name: Feature or rule request
description: Suggest an idea, a new integration, or a rule you want Needl to watch
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should always be true?
      description: Describe the problem or the business rule in plain words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Needl to do?
  - type: input
    id: tools
    attributes:
      label: Tools involved
      description: e.g. GitLab, Sentry, Stripe
