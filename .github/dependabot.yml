version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /apps/web]
    schedule: { interval: weekly }
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
