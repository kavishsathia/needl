# Mirrors .github/workflows/ci.yml for the GitLab copy of the repository.
default:
  image: node:22
  cache:
    key:
      files: [package-lock.json, apps/web/package-lock.json]
    paths: [.npm/]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages: [test]

package:
  stage: test
  script:
    - npm ci
    - npm run check

web:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    NEEDL_TEST_DATABASE_URL: postgres://postgres@postgres:5432/postgres?sslmode=disable
  script:
    - npm ci
    - npm --prefix apps/web ci --legacy-peer-deps
    - npm run web:test
    - npm run web:build
