services:
  - type: web
    name: needl-monitoring-preview
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm --prefix apps/web ci && npm run check && npm --prefix apps/web run test && npm --prefix apps/web run build
    startCommand: npm --prefix apps/web run db:migrate && npm --prefix apps/web run serve
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: BETTER_AUTH_URL
        value: https://needl-monitoring-preview.onrender.com
      - key: NEEDL_TRUSTED_ORIGINS
        value: https://needl-monitoring-preview.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-4o-mini
      - key: NEEDL_TRANSLATION_DAILY_LIMIT
        value: "5"
      - key: NEEDL_SIGNUP_ALLOWLIST
        sync: false
